[data]
fund_code = "161725"        # 招商中证白酒
start = "2020-01-01"
end   = "2024-12-31"
cache_dir = ".cache"

[fees]
buy_rate = 0.0015
sell_tiers = [
  { max_days = 7,   rate = 0.015 },
  { max_days = 365, rate = 0.005 },
  { max_days = 0,   rate = 0.000 },
]

[strategy]
kind = "smart_dca"
[strategy.params]
period = "monthly"
day = 1
base_amount = 1000.0
ma_window = 250
k = 1.0

[[rules]]
kind = "take_profit"
target_return = 0.30

[portfolio]
initial_cash = 0.0

[report]
chart = true
html  = true
out_dir = "output"

# [auth]
# db_path = "data/xlh.db"
# open_registration = true
# warn_days = 7
# grace_days = 3
# session_ttl_days = 30
# secure_cookie = true            # HTTPS 反向代理部署时开启；也可用 XLH_COOKIE_SECURE 覆盖

[realtime]
db_path = "data/realtime.db"
retain_days = 10
baseline_days = 10
price_jump_pct = 0.02
volume_surge_x = 3.0
main_flow_pct = 0.05
strong_signal_x = 1.5
max_push_per_tick = 5

# [trade]
